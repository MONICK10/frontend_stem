<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - STEMQUEST</title>
  <link rel="stylesheet" href="css/signin.css">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="/images/logo1.png">
   
</head>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: 'en',
        includedLanguages: 'en,ta', // English & Odia
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      },
      'google_translate_element'
    );
  }

  // Toggle dropdown when button is clicked
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("translate-btn");
    const el = document.getElementById("google_translate_element");

    btn.addEventListener("click", () => {
      el.style.display = (el.style.display === "none" || el.style.display === "") ? "block" : "none";
    });
  });
</script>

<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>Sign In</h1>
      <div id="translate-container">
  <button id="translate-btn">🌐 Translate</button>
  <div id="google_translate_element"></div>
</div>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="error-msg"></p>

      <!-- 🔹 Register link -->
      <p>Don’t have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>
  <!-- JWT Auth Scripts (NO Firebase needed for signin) -->
  <script src="js/config.js"></script>
  <script src="js/unregister-sw.js"></script>
  <script src="js/api.js"></script>
  
  <script>
    // Check if user already has valid JWT
    console.log('📍 signin.html loaded');
    console.log('Checking for valid JWT token...');
    
    const hasValidToken = api.isTokenValid();
    console.log('api.isTokenValid() returned:', hasValidToken);
    
    if (hasValidToken) {
      console.log('✅ Valid JWT found → Redirecting to index.html');
      window.location.href = 'index.html';
    } else {
      console.log('✅ No valid JWT → User stays on signin page');
    }
  </script>
  <script src="js/signin.js"></script>
</body>
</html>
